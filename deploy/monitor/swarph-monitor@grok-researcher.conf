# card #961. Review copy only.
#
# `swarph monitor install-unit` renders src/swarph_cli/systemd/swarph-monitor@.service
# and does not read this file. Do not copy it into /etc/systemd and do not
# restart swarph-monitor@grok-researcher from the PR. The live cell stays on
# `--deliver pull` until that restart is a reviewed step.
#
# Environment=MESH_GATEWAY_URL on the template survives an ExecStart override.
# This line carries no token and no --gateway flag.
[Service]
ExecStart=
ExecStart=/home/ubuntu/.local/bin/swarph monitor start --as grok-researcher --deliver tmux:grok-researcher --deliver pull --foreground
