# Card #1195. The macOS OS-layer leg: launchd, not the library suite.
#
# macos.yml runs pytest. This workflow loads the packaged monitor plist under
# launchd and proves it drains a stub, survives kill -9 as a new PID, and
# stays down after bootout. The stub is 127.0.0.1 inside the runner. No
# Actions secret, no tailnet, no real mesh.

name: macos-cell-smoke
run-name: launchd cell smoke — ${{ github.event_name }} on ${{ github.ref_name }}

# Card #1738. This is a macOS runner, billed at 10x, so it follows macos.yml:
# daily schedule on main, workflow_dispatch, or a pull request labeled full-ci.
on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  cell-smoke:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    name: launchd cell smoke
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Cell smoke against a stub gateway
        env:
          MESH_GATEWAY_URL: ""
          MESH_GATEWAY_TOKEN: ""
        run: python scripts/macos-cell-smoke.py
