[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarph-cli"
version = "0.50.0"
description = "The `swarph` binary — a multi-LLM CLI and mesh-gateway client + bundled server (`swarph gateway`): one-shot prompts across providers, interactive `chat`, multi-provider `spawn` (claude/codex/antigravity via a ProviderMembrane with subprocess billing-scrub), `mesh` send/inbox/register, `brain-ask` over the swarph-brain (gbrain) semantic memory, git-backed `assisted_memory`, per-invocation `gh` identity routing, a silent DM-wake hook, session `import`, and a stranded-session `watchdog`."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Pierre Samson" },
    { name = "Claude Opus" },
]
keywords = ["swarph", "llm", "cli", "mesh", "gemini", "claude", "deepseek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    # Phase 5 REPL exercises all five adapters; bumped to 0.5.0 for
    # OpenAI + Grok availability in /provider switch.
    #
    # >>> UPPER BOUND ADDED 2026-08-18 (drop, reviewing the 0.44.0 release). <<< The
    # justification was already written three lines BELOW, on the sibling: "the upper
    # bound is load-bearing: it turns an unknown future shared API into a resolver
    # conflict before startup." It applies to swarph-mesh with MORE force — first-party
    # and moving faster — and it was applied to one of the two things it governs.
    #
    # THE BOUND IS <0.9, NOT drop's SUGGESTED <0.6. He reasoned from "0.4.0 -> 0.5.0
    # recently"; MEASURED, swarph-mesh is at 0.8.0 both installed and on PyPI, so <0.6
    # would have excluded the only version that exists and broken every install of
    # this release. Right principle, stale number — checked against the index rather
    # than applied verbatim.
    "swarph-mesh>=0.5.0,<0.9",
    # 0.7.0 adds the provider-extension API used to enable Muse alongside its
    # matching membrane. The upper bound is load-bearing: it turns an unknown
    # future shared API into a resolver conflict before startup.
    "swarph-shared>=0.7.0,<0.8",
    # Phase 7 spawn — cell.yaml parser. PyYAML 6.x is the standard.
    # Stays a swarph-cli dep since file I/O is operator-tooling-layer
    # concern; swarph-shared cell module is pure-stdlib.
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/BrainSurfing-tech/swarph-cli"
Source = "https://github.com/BrainSurfing-tech/swarph-cli"
Substrate = "https://github.com/BrainSurfing-tech/swarph-mesh"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Door 1: `swarph mcp-server` runs an MCP (stdio) server exposing the swarph
# toolbelt (swarph_search/add/describe) to any MCP host. The SDK is an extra
# so the core one-shot/mesh paths don't pull it in; `swarph mcp-server`
# prints a `pip install swarph-cli[mcp]` hint when it's absent.
# mcp 2.0 removed mcp.server.fastmcp (FastMCP left the SDK package); the
# mcp-server command is written against the 1.x API — pin below 2.
mcp = ["mcp>=1.0,<2"]
# `swarph bench run` (metered backend) calls the google-genai Developer API
# directly. The dependency is an extra so `bench`'s pack loader/validate/
# distance-engine paths (and every other swarph-cli verb) stay usable without
# it; MeteredGeminiBackend prints a `pip install swarph-cli[bench]` hint via
# its ImportError message when it's absent.
bench = ["google-genai>=0.3"]
# `swarph bench run --models <id>:mistral` calls Mistral AI's API directly. Same
# reasoning as `bench` above: an extra, so every other verb stays installable
# without it, and MeteredMistralBackend returns a `pip install swarph-cli[mistral]`
# hint in BackendResult.error rather than raising. NOTE THE LANE IS METERED —
# unlike the subscription lanes, every call is a real charge, which is why no
# test in this repo may make one.
mistral = ["mistralai>=1.0"]
# `swarph gateway serve` runs the bundled mesh-gateway HTTP server. The
# FastAPI/uvicorn stack is an extra so the core client paths stay
# dependency-light; the verb prints a `pip install swarph-cli[gateway]`
# hint when these are absent.
gateway = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "croniter>=6.2",
    # B1 Meta-Edge identity: verify RS256 SSO JWTs (the gateway TRUSTS, never
    # signs). [crypto] pulls in `cryptography` for RSA signature verification.
    "PyJWT[crypto]>=2.8",
]
# `swarph service serve` stands up a $0 subscription-LLM HTTP lane. Same
# FastAPI/uvicorn stack as the gateway, behind its own extra so the core
# client paths stay dependency-light; the verb prints a
# `pip install swarph-cli[service]` hint when these are absent.
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.scripts]
swarph = "swarph_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# v0.7.3: ship bundled systemd unit + timer + default templates so
# `swarph watchdog --install-service` can read them via importlib.resources.
# Closes ev_6954f748 substrate-component-installation-gap.
# v0.39.4: ship the silent-monitor unit + the ensure-monitor helper. 0.39.3
# shipped a README telling peers to run scripts/ensure_monitor.sh while the
# wheel did NOT contain it -- non-.py files need declaring here, and a
# clean-room install is what caught it.
# v0.45: ship the guide (#523). `swarph guide` reads it via
# importlib.resources, so an undeclared GUIDE.md passes every test in the
# tree and fails on every installed wheel -- the 0.39.3 bug above, again.
swarph_cli = ["systemd/*.service", "systemd/*.timer", "systemd/*.default",
              "scripts/*.sh", "scripts/*.ps1", "guide/*.md",
              "payloads/postcompact/*.sh", "payloads/postcompact/*.cmd",
    "skills/*/SKILL.md", "skills/*/LICENSE"]
# v0.15: ship the bundled mesh-gateway schema so `swarph gateway serve`
# can apply it at startup via MESH_SCHEMA_PATH (defaults next to server.py).
"swarph_cli.gateway" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tree must win over any installed copy. Without this, `pip install swarph-cli`
# on the same box shadows src/ and the suite silently tests the PUBLISHED wheel
# instead of your edits — every local change reads green whether or not it works.
# Measured 2026-08-01: 1689 passed against site-packages vs 1690 against the tree;
# the only test that noticed was a brand-new one, because the tree and 0.41.0 were
# nearly identical. That agreement is a polluted baseline, not isolation.
pythonpath = ["src"]
addopts = "-v --tb=short"
