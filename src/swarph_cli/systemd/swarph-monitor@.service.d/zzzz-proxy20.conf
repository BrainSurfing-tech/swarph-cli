# Install on the INSTANCE, after 20-tmux-wake-961.conf and zz-pilot20.conf.
[Service]
User=proxy-%i
Group=cell-%i
Environment=
Environment=HOME=/var/lib/swarph-proxy/%i
EnvironmentFile=
PassEnvironment=
UnsetEnvironment=MESH_GATEWAY_URL MESH_GATEWAY_TOKEN PYTHONPATH PYTHONHOME
WorkingDirectory=/var/lib/swarph-proxy/%i
ExecCondition=
ExecStartPre=
ExecStart=
ExecStart=/opt/swarph-proxy/bin/python -I -m swarph_cli.proxy_monitor --cell %i --state-dir /var/log/swarph-proxy/%i/monitor
ExecStartPost=
ExecStop=
ExecStopPost=
ExecReload=
UMask=0027
LimitCORE=0
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=
ReadWritePaths=/var/log/swarph-proxy/%i/monitor
PrivateTmp=yes
